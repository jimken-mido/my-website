---
name: Build and publish docker image
on:
  workflow_call:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout source
      uses: actions/checkout@v4.1.7

    - name: Install npm
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install yarn
      run: npm install -g yarn

    - name: Build page
      run: |
        yarn install
        yarn build

    - name: Login Dockerhub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.GHCR_USERNAME_RW }}
        password: ${{ secrets.GHCR_PASSWORD_RW }}
        registry: ghcr.io

    - name: Build and push docker image
      env:
        IMAGE_TAG: ${{ github.run_number }}
      run: |
        echo $IMAGE_TAG
        image=ghcr.io/midokura/evp2-docs:$IMAGE_TAG
        docker build -t $image .
        docker push $image

    - name: Install GH CLI if not present
      run: |
        if ! which gh
        then
          wget https://github.com/cli/cli/releases/download/v2.14.4/gh_2.14.4_linux_amd64.tar.gz
          tar -xzf gh_2.14.4_linux_amd64.tar.gz
          sudo cp gh_2.14.4_linux_amd64/bin/gh /usr/bin
        fi
    - name: Checkout source
      uses: actions/checkout@v4.1.7
      with:
        repository: midokura/flux-evp
        path: flux-evp
        fetch-depth: 1
        ref: main
        token: ${{ secrets.MIDOJENKINS_ALLREPO_RW }}
    - name: Bump evp2-docs image tag in evp2-docs flux-evp
      env:
        GH_TOKEN: ${{ secrets.MIDOJENKINS_ALLREPO_RW }}
        IMAGE_TAG: ${{ github.run_number }}
      working-directory: flux-evp
      run: |
        if [[ "$IMAGE_TAG" == "" ]]
        then
          echo IMAGE_TAG is empty
          exit 1
        fi
        gh workflow run actions-force-update-evp2-docs-helmrelease.yaml -f evp2DocsDockerImageTag=$IMAGE_TAG
